# Runs on every push and pull request: the API is typechecked, tested against a real
# PostgreSQL database and built. A red cross means don't merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests create and use a separate "ecommerce_test" database on this server
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_db
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
